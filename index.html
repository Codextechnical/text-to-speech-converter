<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Text to Speech</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .btn-large {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-large:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Text to Speech Converter</h2>
    
    <textarea id="text-input" placeholder="Yahan apna text type karein ya paste karein..."></textarea>

    <button class="btn-large" id="speak-btn">Play Audio</button>
</div>

<script>
    // JavaScript: Yeh browser ke inbuilt speech engine ko use karta hai
    const textInput = document.getElementById('text-input');
    const speakBtn = document.getElementById('speak-btn');

    speakBtn.addEventListener('click', () => {
        const text = textInput.value;
        
        // Check karte hain ki text box khali toh nahi hai
        if (text.trim() !== '') {
            const utterance = new SpeechSynthesisUtterance(text);
            
            // Speech ki speed aur pitch set kar sakte hain (optional)
            utterance.rate = 1; // Normal speed
            utterance.pitch = 1; // Normal pitch
            
            // Browser ko bolne ka command dena
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Please enter some text first!');
        }
    });
</script>

</body>
</html>
